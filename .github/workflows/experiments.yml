name: Experiments

# tc/netem scenarios need a real Linux kernel and root, which WSL lacks.
# The work is split into shards; each shard runs on its own runner VM, so the
# shards run in parallel and their `lo` qdisc changes cannot collide.
#
# - push to ci/tc-experiments: runs the fixed shard table below.
# - workflow_dispatch: runs one custom shard from the inputs.

on:
  push:
    branches: [ci/tc-experiments]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite: all, public, before_after, hidden"
        default: "all"
      only:
        description: "Comma-separated scenario prefixes (empty means all)"
        default: ""
      runs:
        description: "Independent runs per arm"
        default: "3"
      quick:
        description: "Use smaller smoke workloads"
        default: "false"
      tc_only:
        description: "Run only scenarios requiring tc/netem"
        default: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          ONLY: ${{ inputs.only }}
          RUNS: ${{ inputs.runs }}
          QUICK: ${{ inputs.quick }}
          TC_ONLY: ${{ inputs.tc_only }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            matrix=$(jq -cn --arg s "$SUITE" --arg o "$ONLY" --arg r "$RUNS" \
              --arg q "$QUICK" --arg t "$TC_ONLY" \
              '{include:[{shard:"custom",suite:$s,only:$o,runs:$r,quick:$q,tc_only:$t}]}')
          else
            # H_base is included wherever checks reference ref:H_base.
            matrix='{"include":[
              {"shard":"t5","suite":"public","only":"T5","runs":"3","quick":"false","tc_only":"false"},
              {"shard":"h3","suite":"hidden","only":"H3,H_base","runs":"3","quick":"false","tc_only":"false"},
              {"shard":"h7","suite":"hidden","only":"H7,H_base","runs":"3","quick":"false","tc_only":"false"},
              {"shard":"h8bw-ba","suite":"all","only":"H8_bandwidth,BA_bandwidth_2mbit","runs":"3","quick":"false","tc_only":"true"},
              {"shard":"h11","suite":"hidden","only":"H11,H_base","runs":"3","quick":"false","tc_only":"false"}
            ]}'
            matrix=$(echo "$matrix" | jq -c .)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  experiments:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2
          python -m pip install --upgrade pip
          pip install -r submission_root/requirements.txt
          chmod +x network_profiles/*.sh

      - name: Enable netem
        run: |
          set -euo pipefail
          if ! sudo modprobe sch_netem 2>/dev/null; then
            echo "sch_netem not loaded; trying linux-modules-extra"
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe sch_netem
          fi
          # Smoke test on the interface the experiment actually uses, so the
          # job fails here with a clear message rather than silently producing
          # unimpaired numbers labelled as impaired.
          sudo tc qdisc add dev lo root netem delay 1ms
          sudo tc qdisc show dev lo
          sudo tc qdisc del dev lo root
          echo "netem is usable on lo"

      - name: Record environment
        run: |
          {
            echo "## Environment (shard ${{ matrix.shard }})"
            echo
            echo '```'
            echo "kernel:  $(uname -r)"
            echo "cpus:    $(nproc)"
            echo "memory:  $(free -h | awk '/^Mem:/{print $2}')"
            echo "python:  $(python -V)"
            tc -V
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run experiments
        continue-on-error: true
        env:
          SUITE: ${{ matrix.suite }}
          ONLY: ${{ matrix.only }}
          RUNS: ${{ matrix.runs }}
          QUICK: ${{ matrix.quick }}
          TC_ONLY: ${{ matrix.tc_only }}
        run: |
          set -euo pipefail
          args=(--suite "$SUITE" --only "$ONLY" --runs "$RUNS")
          if [[ "$QUICK" == "true" ]]; then args+=(--quick); fi
          if [[ "$TC_ONLY" == "true" ]]; then args+=(--tc-only); fi
          python experiments/run_matrix.py "${args[@]}"

      - name: Summarise results
        if: always()
        run: python experiments/report.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiments-results-${{ matrix.shard }}
          path: output/experiments

      - name: Always reset the qdisc
        if: always()
        run: sudo ./network_profiles/reset.sh lo || true
